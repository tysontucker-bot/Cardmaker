<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Folder data</title>
<style>
:root{
  color-scheme:light;
  --bg:#EFE4C6; --panel:#FFFDF7; --text:#1F2A44; --muted:#5B6275; --line:#D6C69A; --teal:#2F7F86;
  --good:#1F7A3E; --goodbg:#DDF1E3; --bad:#B42335; --badbg:#F8DEE1; --prom:#8A5A00; --prombg:#F7E8C4;
  --c:#2F7F86;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#1E2230; --panel:#2A2F40; --text:#F1EBDA; --muted:#B9B3A2; --line:#4A4F62;
    --good:#7FD69C; --goodbg:#1F3B2A; --bad:#F29AA6; --badbg:#46232A; --prom:#F0C76E; --prombg:#433619;
  }
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Lexend,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:14px 14px 120px}
.head{background:var(--panel);border:2px solid var(--line);border-left:10px solid var(--c);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.head .who{font-size:30px;font-weight:800;min-width:2.2em;text-align:center}
.head h1{margin:0;font-size:21px;line-height:1.2}
.head p{margin:2px 0 0;color:var(--muted);font-size:15px}
.meta{display:flex;gap:10px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
.meta label{font-size:15px;color:var(--muted);display:flex;gap:8px;align-items:center}
input[type=date],textarea{font:inherit;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:70px;resize:vertical}
.key{font-size:14px;color:var(--muted);margin:6px 0 10px}
.items{display:flex;flex-direction:column;gap:8px}
.it{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.it .t{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.it .t small{display:block;font-weight:400;color:var(--muted)}
.res{display:flex;gap:6px;flex:none}
.res button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:24px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}
.res button[data-v="+"][aria-pressed=true]{background:var(--goodbg);border-color:var(--good);color:var(--good)}
.res button[data-v="-"][aria-pressed=true]{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.res button[data-v="P"][aria-pressed=true]{background:var(--prombg);border-color:var(--prom);color:var(--prom)}
.add{margin-top:8px;width:100%;border:2px dashed var(--line);background:transparent;color:var(--text);border-radius:12px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
h2{font-size:16px;margin:18px 0 6px;color:var(--muted);font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.sum{flex:1;font-size:15px;line-height:1.3}
.sum b{font-size:19px}
.send{border:0;background:var(--teal);color:#fff;border-radius:12px;padding:14px 22px;font:inherit;font-weight:800;font-size:18px;cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.card h1{margin:0 0 6px;font-size:22px}
.card p{margin:6px 0}
.btn{border:2px solid var(--line);background:transparent;color:var(--text);border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.queue{margin-top:12px;background:var(--prombg);color:var(--text);border:2px solid var(--prom);border-radius:12px;padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.queue[hidden]{display:none}
.queue span{flex:1}
.queue button{margin:0;padding:8px 14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QKEY="folderdata:queue";
const app=$("#app");

/* ---------- read the folder from the QR link ---------- */
function readPayload(){
  const m=location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/); if(!m) return null;
  try{
    const b64=m[1].replace(/-/g,"+").replace(/_/g,"/");
    const bin=atob(b64+"===".slice((b64.length+3)%4));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const d=JSON.parse(new TextDecoder().decode(bytes));
    if(!d||!Array.isArray(d.i)||!d.w) return null;
    return d;
  }catch(e){return null}
}
const D=readPayload();
const endpoint=(w,dm)=>`https://script.google.com/${dm?`a/macros/${encodeURIComponent(dm)}/`:"macros/"}s/${encodeURIComponent(w)}/exec`;

/* ---------- sessions that couldn't send yet wait on this phone ---------- */
function getQueue(){try{return JSON.parse(localStorage.getItem(QKEY)||"[]")}catch(e){return []}}
function setQueue(q){try{localStorage.setItem(QKEY,JSON.stringify(q))}catch(e){}}
async function post(entry){
  // text/plain keeps this a simple request that Apps Script accepts
  const r=await fetch(endpoint(entry.w,entry.dm),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(entry.body),redirect:"follow"});
  const t=(await r.text()).trim();
  if(t!=="ok"&&t!=="duplicate") throw new Error("The sheet answered: "+t.slice(0,120));
}
let flushing=false;
async function flush(){
  if(flushing) return; flushing=true;
  let q=getQueue();
  for(const e of q.slice()){
    try{await post(e); q=getQueue().filter(x=>x.body.id!==e.body.id); setQueue(q);}catch(err){break;}
  }
  flushing=false; paintQueue();
}
function paintQueue(){
  const el=$("#queue"); if(!el) return;
  const n=getQueue().length;
  el.hidden=!n;
  if(n) el.querySelector("span").textContent=`${n} session${n>1?"s are":" is"} saved on this phone, waiting to send to your sheet.`;
}
window.addEventListener("online",flush);

/* ---------- screens ---------- */
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

if(!D){
  app.innerHTML=`<div class="card"><h1>This link is missing its folder</h1><p>Scan the QR code on the folder again. If it keeps happening, print a new QR label from Folder Jobs.</p></div>`;
  return;
}
if(D.c) document.documentElement.style.setProperty("--c",D.c);
document.title=`${D.s?D.s+" · ":""}${D.t||"Folder"} data`;

const KEYS={
  "+":"correct, on their own",
  "-":"incorrect or no response",
  "P":"prompted"
};
let rows, res, dirty=false;
function start(){
  rows = D.a ? Array.from({length:Math.max(1,D.n||5)},(_,i)=>`Opportunity ${i+1}`) : D.i.slice();
  res = rows.map(()=>"");
  dirty=false;
  paint();
}
function paint(){
  const keyLine = D.a ? "+ requested on their own · − no request · P prompted" : "+ correct on their own · − incorrect or no response · P prompted";
  app.innerHTML=`
    <div class="head"><div class="who" aria-label="Student">${esc(D.s||"—")}</div><div><h1>${esc(D.t||"Folder job")}</h1><p>${esc(D.f||"")}${D.f?" folder":""}</p></div></div>
    <div class="meta"><label>Date <input type="date" id="date" value="${today()}"></label></div>
    <p class="key">${keyLine}. Tap again to clear. Leave anything you didn’t present blank.</p>
    <div class="items">${rows.map((r,i)=>itemHTML(r,i)).join("")}</div>
    ${D.a?`<button class="add" id="addRow" type="button">+ Add an opportunity</button>`:""}
    <h2><label for="notes">Notes (optional)</label></h2>
    <textarea id="notes" placeholder="Anything to remember about this session"></textarea>
    <div class="queue" id="queue" hidden><span></span><button class="btn" type="button" id="retry">Send now</button></div>
    <div class="bar"><div class="in"><div class="sum" id="sum" aria-live="polite"></div><button class="send" id="send" type="button" disabled>Send</button></div></div>`;
  wire(); paintSum(); paintQueue();
}
function itemHTML(r,i){
  const parts=String(r).match(/^(.*?)\s*\(([^)]*)\)$/);
  const label=parts?`${esc(parts[1])}<small>${esc(parts[2])}</small>`:esc(r);
  return `<div class="it" data-i="${i}"><div class="t">${label}</div><div class="res" role="group" aria-label="${esc(r)}">${["+","-","P"].map(v=>`<button type="button" data-v="${v}" aria-pressed="${res[i]===v}" aria-label="${v==="-"?"minus":v==="+"?"plus":"P"}, ${KEYS[v]}">${v==="-"?"−":v}</button>`).join("")}</div></div>`;
}
function wire(){
  app.querySelector(".items").addEventListener("click",e=>{
    const b=e.target.closest(".res button"); if(!b) return;
    const i=+b.closest(".it").dataset.i, v=b.dataset.v;
    res[i]=res[i]===v?"":v; dirty=true;
    b.closest(".res").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(res[i]===x.dataset.v)));
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(_){}
    paintSum();
  });
  const add=$("#addRow");
  if(add) add.onclick=()=>{rows.push(`Opportunity ${rows.length+1}`); res.push(""); const box=app.querySelector(".items"); box.insertAdjacentHTML("beforeend",itemHTML(rows[rows.length-1],rows.length-1)); box.lastElementChild.scrollIntoView({block:"nearest"});};
  $("#notes").addEventListener("input",()=>{dirty=true});
  $("#send").onclick=send;
  $("#retry").onclick=flush;
}
function counts(){let c=0,x=0,p=0;res.forEach(v=>{if(v==="+")c++;else if(v==="-")x++;else if(v==="P")p++;});return {c,x,p,n:c+x+p};}
function paintSum(){
  const {c,x,p,n}=counts();
  $("#sum").innerHTML=n?`<b>${Math.round(c/n*100)}%</b> on their own<br>+ ${c} · − ${x} · P ${p} of ${n}`:`Tap + − P for each item`;
  $("#send").disabled=!n;
}
async function send(){
  const btn=$("#send"); if(btn.disabled) return;
  const body={id:uid(),date:$("#date").value||today(),s:D.s||"",f:D.f||"",t:D.t||"",g:D.g||"",
    r:rows.map((r,i)=>[r,res[i]]).filter(x=>x[1]),notes:$("#notes").value.trim()};
  const entry={w:D.w,dm:D.dm||"",body};
  btn.disabled=true; btn.textContent="Sending…";
  const q=getQueue(); q.push(entry); setQueue(q);   // keep it safe first, then send
  let sent=false, why="";
  try{await post(entry); sent=true; setQueue(getQueue().filter(x=>x.body.id!==body.id));}
  catch(err){why=err&&err.message&&err.message.startsWith("The sheet answered")?err.message:"";}
  dirty=false;
  const {c,n}=counts();
  app.innerHTML=`<div class="card">${sent
    ?`<h1>Saved to your sheet ✓</h1><p>${esc(D.s||"")} · ${esc(D.t||"")}: ${c} of ${n} on their own (${Math.round(c/n*100)}%).</p>`
    :`<h1>Saved on this phone</h1><p>It couldn’t reach your Google Sheet${why?"":", probably no connection"}. It will send the next time you open any folder QR code with a connection, or tap Send now.</p>${why?`<p class="key">${esc(why)}</p>`:""}`}
    <button class="btn primary" type="button" id="again">Take data again</button></div>
    <div class="queue" id="queue" hidden><span></span><button class="btn" type="button" id="retry">Send now</button></div>`;
  $("#again").onclick=start; $("#retry").onclick=flush;
  paintQueue();
  if(!sent) setTimeout(flush,4000);
}
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue="";}});
start();
flush();
})();
</script>
</body>
</html>
